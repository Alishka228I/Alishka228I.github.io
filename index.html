<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alishka228I</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0a0a0f;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

#loader{
position:fixed;
inset:0;
background:#05050a;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
transition:opacity .6s ease;
}

.loader-content{
text-align:center;
}

.loader-logo{
width:120px;
height:120px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:48px;
font-weight:bold;
margin:auto;
background:linear-gradient(135deg,#7c6fdb,#e879a0);
}

.loader-text{
margin-top:20px;
margin-bottom:25px;
letter-spacing:3px;
color:#aaa;
}

#enterBtn{
padding:14px 30px;
border:none;
border-radius:999px;
background:linear-gradient(135deg,#7c6fdb,#e879a0);
color:white;
cursor:pointer;
font-size:16px;
}

body.loaded #loader{
opacity:0;
pointer-events:none;
}

.main{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:340px;
padding:30px;
border-radius:24px;
background:#111118;
text-align:center;
border:1px solid #222;
}

.vinyl{
width:140px;
height:140px;
border-radius:50%;
margin:25px auto;
background:conic-gradient(#1a1a2e,#2d1e52,#1a1a2e);
}

.vinyl.spinning{
animation:spin 3s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-top:20px;
}

.ctrl-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#1c1c2a;
color:white;
font-size:22px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.play-btn{
width:64px;
height:64px;
font-size:26px;
background:linear-gradient(135deg,#7c6fdb,#e879a0);
}

.prog-wrap{
margin-top:20px;
cursor:pointer;
}

.prog-bar{
height:4px;
background:#2a2a3e;
border-radius:999px;
overflow:hidden;
}

.prog-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#7c6fdb,#e879a0);
}

.time-row{
display:flex;
justify-content:space-between;
font-size:12px;
margin-top:6px;
color:#aaa;
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-content">
    <div class="loader-logo">A</div>
    <div class="loader-text">ENTER</div>
    <button id="enterBtn">OPEN</button>
  </div>
</div>

<div class="main">
  <div class="card">

    <h1>Dracula</h1>
    <p style="margin-top:8px;color:#aaa;">Tame Impala</p>

    <div class="vinyl" id="vinyl"></div>

    <div class="prog-wrap" id="progWrap">
      <div class="prog-bar">
        <div class="prog-fill" id="progFill"></div>
      </div>

      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnPrev">⏮</button>
      <button class="ctrl-btn play-btn" id="btnPlay">▶</button>
      <button class="ctrl-btn" id="btnNext">⏭</button>
    </div>

  </div>
</div>

<audio id="audioPlayer">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('audioPlayer');
const vinyl = document.getElementById('vinyl');

const fill = document.getElementById('progFill');
const curEl = document.getElementById('curTime');
const durEl = document.getElementById('durTime');

const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

const enterBtn = document.getElementById('enterBtn');
const progWrap = document.getElementById('progWrap');

function formatTime(seconds){
const mins = Math.floor(seconds / 60);
const secs = Math.floor(seconds % 60).toString().padStart(2,'0');
return `${mins}:${secs}`;
}

audio.addEventListener('loadedmetadata', () => {
durEl.textContent = formatTime(audio.duration);
});

function updateProgress(){
if(!audio.duration) return;

const percent = (audio.currentTime / audio.duration) * 100;

fill.style.width = percent + '%';
curEl.textContent = formatTime(audio.currentTime);
}

audio.addEventListener('timeupdate', updateProgress);

function togglePlay(){
if(audio.paused){
audio.play();
vinyl.classList.add('spinning');
btnPlay.textContent = '⏸';
}else{
audio.pause();
vinyl.classList.remove('spinning');
btnPlay.textContent = '▶';
}
}

btnPlay.addEventListener('click', togglePlay);

btnPrev.addEventListener('click', () => {
audio.currentTime = Math.max(audio.currentTime - 10, 0);
});

btnNext.addEventListener('click', () => {
audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
});

progWrap.addEventListener('click', e => {
const rect = progWrap.getBoundingClientRect();
const clickX = e.clientX - rect.left;
const percent = clickX / rect.width;

audio.currentTime = percent * audio.duration;
});

enterBtn.addEventListener('click', async () => {
document.body.classList.add('loaded');

try{
await audio.play();
vinyl.classList.add('spinning');
btnPlay.textContent = '⏸';
}catch(e){
console.log(e);
}
});

audio.addEventListener('pause', () => {
vinyl.classList.remove('spinning');
btnPlay.textContent = '▶';
});

audio.addEventListener('ended', () => {
vinyl.classList.remove('spinning');
btnPlay.textContent = '▶';
});
</script>

</body>
</html>
